{% extends "base.html" %}

{% block title %}
Order Confirmed
{% endblock %}

{% block content %}

<div class="card">

    <h1>✅ Order Confirmed</h1>

    <h2>Order #{{ order.id }}</h2>

    <p>Status: {{ order.status }}</p>

    <a class="button"
       href="{% url 'order_history' %}">
        View Order History
    </a>

</div>

{% endblock %}
