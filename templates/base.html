<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Pizza Paradise{% endblock %}</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        nav {
            background-color: #b22222;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: white;
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 40px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
        }

        footer {
            text-align: center;
            padding: 25px;
            background-color: #222;
            color: white;
            margin-top: 50px;
        }

        .button {
            display: inline-block;
            background-color: #b22222;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 5px;
        }

    </style>

</head>

<body>

<nav>

    <h2>🍕 Pizza Paradise</h2>

    <div>

        <a href="/">Home</a>

        {% if user.is_authenticated %}
            <a href="/orders/history/">Orders</a>

            <form method="post"
                  action="{% url 'logout' %}"
                  style="display:inline;">

                {% csrf_token %}

                <button type="submit">
                    Logout
                </button>

            </form>

        {% else %}

            <a href="{% url 'login' %}">
                Login
            </a>

            <a href="{% url 'register' %}">
                Register
            </a>

        {% endif %}

    </div>

</nav>

<div class="container">

    {% block content %}
    {% endblock %}

</div>

<footer>

    © 2026 Pizza Paradise

</footer>

</body>
</html>
